<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 288" role="img" aria-labelledby="title desc">
  <title id="title">LegacySift mark</title>
  <desc id="desc">Gray legacy files cross a navy and blue bridge toward two ordered blue files.</desc>
  <defs>
    <linearGradient id="legacyGray" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B8C1CC"/>
      <stop offset="1" stop-color="#6B7280"/>
    </linearGradient>
    <linearGradient id="bridgeNavy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10243E"/>
      <stop offset="1" stop-color="#0B3D91"/>
    </linearGradient>
    <linearGradient id="currentBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E88FF"/>
      <stop offset="1" stop-color="#0B63BC"/>
    </linearGradient>
  </defs>

  <g fill="url(#legacyGray)">
    <path d="M42 135h54l20 20v70H42z"/>
    <path d="M96 135v21h20z" fill="#F5F7FA"/>
    <path d="M106 103h52l19 19v71h-71z" opacity=".88"/>
    <path d="M157 103v20h20z" fill="#F5F7FA"/>
  </g>

  <path fill="url(#bridgeNavy)" fill-rule="evenodd"
        d="M26 224C116 224 143 71 256 71S396 224 486 224v34H26zm111 34h238c-26-72-66-126-119-126s-93 54-119 126z"/>
  <path d="M25 218C128 218 153 58 256 58s128 160 231 160"
        fill="none" stroke="url(#currentBlue)" stroke-width="12" stroke-linecap="round"/>

  <g fill="url(#currentBlue)">
    <path d="M352 116h55l21 21v88h-76z"/>
    <path d="M407 116v22h21z" fill="#F5F7FA"/>
    <path d="M416 82h58l22 22v121h-80z"/>
    <path d="M474 82v23h22z" fill="#F5F7FA"/>
  </g>
</svg>
