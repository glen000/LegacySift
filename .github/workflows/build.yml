name: build

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release
        shell: pwsh
        run: msbuild LegacySift.sln /m /warnaserror /p:Configuration=Release /p:Platform="Any CPU"

      - name: Verify removed localization is absent from shipped sources
        shell: pwsh
        run: |
          $hits = Get-ChildItem src -Recurse -File | Select-String -Pattern 'AppLanguage\.Russian|FlagKind\.Russia|Русский|language=ru'
          if ($hits) { $hits | ForEach-Object { Write-Error $_ }; throw 'Removed Russian localization is still present in shipped sources.' }

      - name: Run smoke tests
        shell: pwsh
        run: .\tests\LegacySift.Tests\bin\Release\LegacySift.Tests.exe --capture-layout .\layout-screenshots

      - name: Package portable build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item src\LegacySift\bin\Release\LegacySift.exe dist\LegacySift.exe
          Copy-Item README.md dist\README.md
          Copy-Item LICENSE dist\LICENSE.txt
          Compress-Archive -Path dist\LegacySift.exe,dist\README.md,dist\LICENSE.txt -DestinationPath LegacySift-windows.zip -Force
          $zipHash = (Get-FileHash LegacySift-windows.zip -Algorithm SHA256).Hash.ToLower()
          "$zipHash  LegacySift-windows.zip" | Set-Content LegacySift-windows.zip.sha256 -Encoding ascii
          Write-Host "Portable ZIP SHA256: $zipHash"
          Add-Type -AssemblyName System.Drawing
          $exeIcon = [System.Drawing.Icon]::ExtractAssociatedIcon((Resolve-Path dist\LegacySift.exe))
          if ($null -eq $exeIcon) { throw 'Packaged executable does not expose an application icon.' }
          try { Write-Host "Packaged EXE icon: $($exeIcon.Width)x$($exeIcon.Height)" }
          finally { $exeIcon.Dispose() }
          $screenshots = @(Get-ChildItem layout-screenshots\*.png | Sort-Object Name)
          if ($screenshots.Count -lt 13) { throw "Expected at least 13 Light client and title-bar screenshots; found $($screenshots.Count)." }
          @('titlebar-light-active.png', 'titlebar-light-inactive.png') | ForEach-Object {
            if (-not (Test-Path (Join-Path 'layout-screenshots' $_))) { throw "Missing required title-bar screenshot: $_" }
          }
          $screenshots | ForEach-Object {
            $image = [System.Drawing.Image]::FromFile($_.FullName)
            try { Write-Host "Layout screenshot: $($_.Name) $($image.Width)x$($image.Height) ($($_.Length) bytes)" }
            finally { $image.Dispose() }
          }
          $qa = [System.Drawing.Image]::FromFile((Resolve-Path docs\assets\legacysift-icon-qa.png))
          try { Write-Host "Icon QA contact sheet: $($qa.Width)x$($qa.Height)" }
          finally { $qa.Dispose() }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LegacySift-windows
          path: |
            LegacySift-windows.zip
            LegacySift-windows.zip.sha256
            layout-screenshots\*.png
            docs\assets\legacysift-icon-qa.png
            docs\assets\legacysift-icon-source.png
            docs\assets\legacysift-logo-light.png
            docs\assets\icon-sizes\*.png
