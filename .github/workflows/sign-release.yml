name: sign-release

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  build-test-sign:
    runs-on: windows-latest

    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}

    steps:
      - name: Validate release branch
        shell: pwsh
        run: |
          if ("${{ github.ref }}" -ne "refs/heads/main") {
            throw "Release signing is restricted to main. Current ref: ${{ github.ref }}"
          }

      - name: Validate SignPath configuration
        shell: pwsh
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_API_TOKEN)) { $missing += "secret SIGNPATH_API_TOKEN" }
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_ORGANIZATION_ID)) { $missing += "variable SIGNPATH_ORGANIZATION_ID" }
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_PROJECT_SLUG)) { $missing += "variable SIGNPATH_PROJECT_SLUG" }
          if ([string]::IsNullOrWhiteSpace($env:SIGNPATH_SIGNING_POLICY_SLUG)) { $missing += "variable SIGNPATH_SIGNING_POLICY_SLUG" }
          if ($missing.Count -gt 0) {
            throw "SignPath is not configured. Missing: $($missing -join ', ')"
          }

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release
        shell: pwsh
        run: msbuild LegacySift.sln /m /warnaserror /p:Configuration=Release /p:Platform="Any CPU"

      - name: Verify removed localization is absent from shipped sources
        shell: pwsh
        run: |
          $hits = Get-ChildItem src -Recurse -File | Select-String -Pattern 'AppLanguage\.Russian|FlagKind\.Russia|Русский|language=ru'
          if ($hits) {
            $hits | ForEach-Object { Write-Error $_ }
            throw "Removed Russian localization is still present in shipped sources."
          }

      - name: Run smoke tests
        shell: pwsh
        run: .\tests\LegacySift.Tests\bin\Release\LegacySift.Tests.exe

      - name: Read executable version
        id: version
        shell: pwsh
        run: |
          $exe = Resolve-Path "src\LegacySift\bin\Release\LegacySift.exe"
          $version = (Get-Item $exe).VersionInfo.FileVersion
          if ([string]::IsNullOrWhiteSpace($version)) { throw "LegacySift.exe has no FileVersion." }
          "value=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Signing version: $version"

      - name: Stage unsigned signing artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force signing-input | Out-Null
          Copy-Item src\LegacySift\bin\Release\LegacySift.exe signing-input\LegacySift.exe
          Copy-Item README.md signing-input\README.md
          Copy-Item LICENSE signing-input\LICENSE.txt

      - name: Upload unsigned artifact for SignPath
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: LegacySift-signing-input
          path: signing-input\*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Submit SignPath signing request
        id: signpath
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: '${{ secrets.SIGNPATH_API_TOKEN }}'
          organization-id: '${{ vars.SIGNPATH_ORGANIZATION_ID }}'
          project-slug: '${{ vars.SIGNPATH_PROJECT_SLUG }}'
          signing-policy-slug: '${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}'
          github-artifact-id: '${{ steps.upload-unsigned.outputs.artifact-id }}'
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signpath-signed
          parameters: |
            version: "${{ steps.version.outputs.value }}"

      - name: Verify signed executable
        shell: pwsh
        run: |
          $exe = Resolve-Path "signpath-signed\LegacySift.exe"
          $signature = Get-AuthenticodeSignature $exe
          $signature | Format-List | Out-String | Write-Host
          if ($signature.Status -ne [System.Management.Automation.SignatureStatus]::Valid) {
            throw "Signed LegacySift.exe does not have a valid Authenticode signature. Status: $($signature.Status)"
          }

      - name: Package signed portable build
        shell: pwsh
        run: |
          Compress-Archive -Path signpath-signed\LegacySift.exe,signpath-signed\README.md,signpath-signed\LICENSE.txt -DestinationPath LegacySift-windows-signed.zip -Force
          $zipHash = (Get-FileHash LegacySift-windows-signed.zip -Algorithm SHA256).Hash.ToLower()
          "$zipHash  LegacySift-windows-signed.zip" | Set-Content LegacySift-windows-signed.zip.sha256 -Encoding ascii
          Write-Host "Signed portable ZIP SHA256: $zipHash"

      - name: Upload signed release candidate
        uses: actions/upload-artifact@v4
        with:
          name: LegacySift-windows-signed
          path: |
            LegacySift-windows-signed.zip
            LegacySift-windows-signed.zip.sha256
          if-no-files-found: error
